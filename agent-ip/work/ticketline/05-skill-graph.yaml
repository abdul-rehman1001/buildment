edges:
  - from: ts
    to: express
    reason: The API is TypeScript.
  - from: ts
    to: nextjs
    reason: The web app is TypeScript and React.
  - from: http
    to: express
    reason: Routes and middleware assume the request/response model.
  - from: sql
    to: postgres
    reason: Schema and query design build on SQL.
  - from: postgres
    to: prisma
    reason: Prisma models the relational schema.
  - from: prisma
    to: events
    reason: Events and ticket types are persisted through Prisma.
  - from: express
    to: auth
    reason: Auth is implemented as API routes and middleware.
  - from: auth
    to: rbac
    reason: Roles are enforced after authentication.
  - from: events
    to: ticket-types
    reason: Ticket types belong to events.
  - from: ticket-types
    to: holds
    reason: Holds claim ticket-type capacity.
  - from: holds
    to: concurrency
    reason: Holds must be atomic under concurrent buyers.
  - from: concurrency
    to: payments
    reason: Payment confirmation converts a hold to an order.
  - from: payments
    to: webhooks
    reason: Payment confirmation arrives through a webhook.
  - from: webhooks
    to: qr
    reason: A confirmed order issues tickets.
  - from: qr
    to: checkin
    reason: Check-in validates the ticket token.
  - from: checkin
    to: offline
    reason: Offline mode extends check-in with a local queue.
  - from: caching
    to: deploy
    reason: Production performance is measured and tuned before launch.
  - from: observability
    to: deploy
    reason: A deployed system needs logs, errors, and metrics.

diagnostic:
  - question: Can you explain the difference between a 401 and a 403?
    maps_to: http
    if_missing: Read the HTTP status section and complete the short repair lab.
  - question: Can you write a SQL join and add an index to a column?
    maps_to: sql
    if_missing: Complete the SQL repair lab before Module 3.
  - question: Can you explain what a transaction does?
    maps_to: sql
    if_missing: Read the transaction primer before Module 4.
  - question: Have you built a REST API with Express or a similar framework?
    maps_to: express
    if_missing: Complete the Express repair lab before Module 2.
  - question: Have you used a React or Next.js app with server-side data?
    maps_to: nextjs
    if_missing: Complete the Next.js repair lab before Module 3.
  - question: Can you use Git branches and pull requests?
    maps_to: git
    if_missing: Complete the Git workflow lab before Module 1.
