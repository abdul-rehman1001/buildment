outcomes:
  - id: O1
    statement: Model events, ticket types, holds, orders, tickets, and scans with explicit invariants.
    evidence: ERD, Prisma migration, invariant tests
    level: application
  - id: O2
    statement: Implement session auth and role-based authorization.
    evidence: Auth API tests, role matrix, IDOR checks
    level: application
  - id: O3
    statement: Publish events and ticket types with correct capacity and sale windows.
    evidence: Organizer flow, public event page, search
    level: application
  - id: O4
    statement: Prevent overselling with concurrency-safe holds and expiry.
    evidence: Concurrent race test, hold-expiry test, availability UI
    level: analysis
  - id: O5
    statement: Integrate Stripe test-mode payments with idempotent webhooks.
    evidence: Paid order, duplicate-webhook test, refund path
    level: application
  - id: O6
    statement: Issue signed QR tickets and deliver them.
    evidence: Ticket email, QR uniqueness, forged-code rejection
    level: application
  - id: O7
    statement: Check tickets in online and offline without duplicates.
    evidence: Online/offline scan tests, sync report, conflict handling
    level: evaluation
  - id: O8
    statement: Harden, deploy, and defend the system.
    evidence: Deployed URL, test suite, runbook, viva
    level: creation

modules:
  - id: 1
    name: Foundation
    hours: 20
    outcome: A product contract, permission model, architecture, ERD, and deployed skeleton.
  - id: 2
    name: Auth and roles
    hours: 22
    outcome: Secure sessions, auth endpoints, role/ownership enforcement, organizer onboarding, and auth tests.
  - id: 3
    name: Events and ticket types
    hours: 22
    outcome: A published event with ticket types, capacity, images, search, and the Week 1 gate.
  - id: 4
    name: Inventory, holds, and concurrency
    hours: 30
    outcome: A race-safe hold flow with expiry and release.
  - id: 5
    name: Checkout and payments
    hours: 30
    outcome: A paid order with idempotent webhook confirmation and refunds.
  - id: 6
    name: Tickets, QR codes, and delivery
    hours: 18
    outcome: Signed tickets delivered to the buyer.
  - id: 7
    name: Gate check-in and offline mode
    hours: 24
    outcome: One-ticket-one-entry online and offline.
  - id: 8
    name: Hardening, deploy, and defense
    hours: 26
    outcome: A deployed, tested, observable system and a defended capstone.

interaction_grammar:
  concept: prose, one worked example, one BigWordAlert, optional ComparePanel/Predict/canvas
  build: Steps, code fences, FileTree or TerminalBlock, acceptance criteria, one failure mode
  verify: Checklist, TraceRequest, DiffBlock, one failure test
  checkpoint: three to five scenario quizzes, one open question, ChapterRecap
  gate: Checklist, LearningLog, ChapterRecap, bridge to the next module
  canvas: one per chapter, only in concept/decision chapters, prediction before and transfer check after
  density: one BigWordAlert, one diagram, two callouts, one Predict, one canvas, one OpenQuestion, one CodeExercise, one read, one real-world event per chapter

capstone:
  product: Deployed Ticketline with organizer dashboard, public event page, checkout, QR tickets, scanner, and minimal admin.
  demo:
    - Organizer publishes an event with two ticket types and capacity.
    - Two buyers race for the last ticket; one hold wins.
    - Stripe test payment confirms through a webhook.
    - QR ticket scans once; duplicate scan is rejected.
    - Offline scan syncs without duplication.
    - Organizer dashboard shows sales and check-ins.
  defense:
    - Hold state machine and expiry.
    - Concurrency mechanism and race test.
    - Webhook signature, event dedupe, and idempotency.
    - Duplicate scan and offline conflict handling.
    - Time zones, authorization matrix, and what changes at 100× scale.

risks:
  - risk: Setup friction across web, API, Postgres, Redis, and S3.
    mitigation: One docker-compose file, one pnpm workspace, one health check, first deploy in Week 1.
  - risk: Payments and webhooks require external accounts.
    mitigation: Stripe test mode with a documented local webhook path; no real money.
  - risk: Concurrency is hard to observe.
    mitigation: A canvas and a real race test; learners see the failure before fixing it.
  - risk: The course becomes a feature checklist.
    mitigation: One core loop; variants change constraints, not feature count.
  - risk: Offline sync becomes a distributed-systems project.
    mitigation: Cached signed tickets and an idempotent local queue; no CRDT.
