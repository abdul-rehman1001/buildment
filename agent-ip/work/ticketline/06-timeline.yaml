week_1_total_hours: 64
week_1_gate: The organizer publishes an event, the buyer finds it, the public page is correct, and the audit passes.

later_modules:
  - id: 4
    hours: 30
    gate: Race test proves no overselling; expired hold returns inventory.
  - id: 5
    hours: 30
    gate: Paid order issues tickets; duplicate webhook does not duplicate tickets.
  - id: 6
    hours: 18
    gate: Buyer receives a valid ticket; forged code fails.
  - id: 7
    hours: 24
    gate: Ticket scans once; offline scans sync without duplicates.
  - id: 8
    hours: 26
    gate: Deployed URL, passing tests, runbook, viva.

risks:
  - week: 1
    risk: Environment setup consumes the week.
    mitigation: One docker-compose file, one workspace, copy-ready envs, health check first.
  - week: 2
    risk: Concurrency and payments are abstract.
    mitigation: A canvas before the code, a real race test, Stripe test cards.
  - week: 3
    risk: Offline sync becomes a research project.
    mitigation: Cached signed tickets and an idempotent local queue only.
  - week: 4
    risk: Deployment and defense are rushed.
    mitigation: Deploy in Week 1, then harden; reserve the last day for the viva.
