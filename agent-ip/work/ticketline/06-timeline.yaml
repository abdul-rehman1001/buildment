artifact: timeline
course: ticketline
version: 1
core_hours: 210
stretch_hours: 280

weeks:
  - week: 1
    focus: Foundation and organizer flow
    modules: [1, 2, 3]
    hours: 64
    demo: Organizer publishes an event; buyer finds it.
  - week: 2
    focus: Inventory and payments
    modules: [4, 5]
    hours: 60
    demo: Last-ticket race is safe; paid order issues tickets.
  - week: 3
    focus: Tickets and gate
    modules: [6, 7]
    hours: 42
    demo: QR ticket scans once; offline sync works.
  - week: 4
    focus: Hardening and defense
    modules: [8]
    hours: 44
    demo: Deployed system, passing tests, viva.

